  <style>
    :root {
      --app-background: #10231d;
      --loading-background: radial-gradient(circle at 50% 36%, #26543f 0%, #173226 58%, #10231d 100%);
      --loading-ink: #edf7f0;
      --loading-muted: #b7d3c2;
      --loading-track: rgba(184, 227, 198, 0.18);
      --loading-progress: #58c467;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --app-background: #edf7ef;
        --loading-background: radial-gradient(circle at 50% 36%, #ffffff 0%, #e5f5e8 58%, #d2ecd8 100%);
        --loading-ink: #173226;
        --loading-muted: #50705d;
        --loading-track: rgba(38, 84, 63, 0.16);
        --loading-progress: #2f9b4b;
      }
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--app-background);
      color: var(--loading-ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #zib-controls, #result { display: none; }
    #canvas-frame { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
    canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      object-position: center;
      border: 0;
      background: var(--app-background);
    }
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      isolation: isolate;
      overflow: hidden;
      background: #173226;
      opacity: 1;
      transition: opacity 420ms ease, visibility 420ms ease;
    }
    .loading-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-art, .loading-art img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .loading-art { z-index: -2; }
    .loading-art img { object-fit: cover; }
    .loading-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, #10231d00 42%, #10231d12 62%, #10231dc9 100%);
    }
    .loading-mark {
      position: absolute;
      top: max(5vh, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(88vw, 95vh, 760px);
      height: auto;
      filter: drop-shadow(0 5px 16px #17322650);
    }
    .loading-panel {
      position: absolute;
      left: 50%;
      bottom: max(7vh, calc(env(safe-area-inset-bottom) + 24px));
      transform: translateX(-50%);
      width: min(300px, calc(100% - 48px));
      box-sizing: border-box;
      display: grid;
      justify-items: center;
      gap: 12px;
      padding: 20px 22px;
      border: 1px solid #e2f3d344;
      border-radius: 18px;
      background: #163b2be8;
      box-shadow: 0 10px 35px #10231d3b;
      text-align: center;
      color: #f7f9eb;
    }
    .loading-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .loading-tagline { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .01em; }
    #status { min-height: 1.4em; color: #d5e9cf; font-size: 13px; }
    #progress {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      background: #c0dfac35;
    }
    @media (max-height: 420px) and (min-aspect-ratio: 1/1) {
      .loading-panel { bottom: 20px; padding: 12px 18px; gap: 7px; }
      .loading-mark { width: min(62vh, 480px); top: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .loading-screen { transition: none; } }
    #progress::-webkit-progress-bar { border-radius: 999px; background: var(--loading-track); }
    #progress::-webkit-progress-value { border-radius: 999px; background: var(--loading-progress); }

<body>
  <div class="loading-screen" id="loading-screen" aria-labelledby="loading-title">
    <picture class="loading-art" aria-hidden="true">
      <source media="(max-aspect-ratio: 1/1)" srcset="title-portrait.png?v=__SHOVEY_REVISION__">

    </picture>
    <img class="loading-mark" src="logo.png?v=__SHOVEY_REVISION__" alt="" width="1200" height="410" fetchpriority="high">
    <div class="loading-panel">
      <h1 class="loading-title" id="loading-title">Shovey</h1>
      <p class="loading-tagline">Push. Solve. Come home.</p>
      <div id="status" role="status" aria-live="polite">Loading your way home…</div>
      <progress id="progress" value="0" max="100" aria-label="Loading Shovey"></progress>
    </div>
  </div>
  <div id="zib-controls"></div>
  <div id="canvas-frame"><canvas id="canvas"></canvas></div>
  <pre id="result">pending</pre>
  <script>
    var loadingScreen = document.getElementById('loading-screen');
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var buildRevision = '__SHOVEY_REVISION__';
    var pageTitle = document.title;
    var wasmBytes = __SHOVEY_WASM_BYTES__;
    var loadingCheck;
    function startingGame() {
      statusElement.textContent = 'Opening Shovey…';
      progressElement.removeAttribute('value');
    }
    async function instantiateGame(imports) {
      var received = 0;
      var response = await fetch('index.wasm?v=' + buildRevision, {credentials: 'same-origin'});
      if (!response.ok) throw new Error('Game download returned ' + response.status);
      function downloaded(bytes) {
        received += bytes;
        var percent = Math.min(100, Math.floor(received * 100 / wasmBytes));
        progressElement.max = 100;
        progressElement.value = percent;
        statusElement.textContent = 'Downloading Shovey… ' + percent + '%';
      }
      var result;
      if (response.body && typeof TransformStream !== 'undefined' && WebAssembly.instantiateStreaming) {
        var stream = response.body.pipeThrough(new TransformStream({
          transform: function(chunk, controller) { downloaded(chunk.byteLength); controller.enqueue(chunk); },
          flush: startingGame
        }));
        result = await WebAssembly.instantiateStreaming(new Response(stream, {headers: {'Content-Type': 'application/wasm'}}), imports);
      } else {
        var bytes = await response.arrayBuffer();
        downloaded(bytes.byteLength);
        startingGame();
        result = await WebAssembly.instantiate(bytes, imports);
      }
      startingGame();
      return result;
    }
    function hideLoadingScreen() {
      if (loadingCheck) return;
      function ready() {
        try {
          var hostStatus = document.querySelector('#zib-controls span');
          if (hostStatus && /could not|failed|unavailable|not available|not a valid/i.test(hostStatus.textContent)) {
            statusElement.textContent = hostStatus.textContent;
            progressElement.hidden = true;
            return;
          }
          var fs = Module.FS;
          var canvas = document.getElementById('canvas');
          if (fs && fs.analyzePath('/kryon-apps/shovey/assets/shovey/catalog.json').exists && canvas.width && canvas.height) {
            if (Module.profileReady) {
              document.title = pageTitle;
              loadingScreen.classList.add('is-hidden');
              return;
            }
          }
        } catch (_) {}
        loadingCheck = window.requestAnimationFrame(ready);
      }
      loadingCheck = window.requestAnimationFrame(ready);
    }
    var Module = {
      locateFile: function(path) { return path === 'runtime.wasm' ? 'index.wasm?v=' + buildRevision : path; },
      instantiateWasm: function(imports, ready) {
        instantiateGame(imports).then(function(result) { ready(result.instance); }).catch(function(error) { Module.onAbort(error); });
        return {};
      },
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = {time: Date.now(), text: ''};
        if (text === Module.setStatus.last.text) return;
        var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (match && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (match) {
          statusElement.textContent = match[1];
          progressElement.value = parseInt(match[2], 10) * 100;
          progressElement.max = parseInt(match[4], 10) * 100;
        } else {
          statusElement.textContent = text || 'Opening Shovey…';
          if (!text) { startingGame(); hideLoadingScreen(); }
        }
      },
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies || 0, left);
        this.setStatus(left ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'Ready.');
      },
      onExit: function(status) {
        document.getElementById('result').textContent = status === 0 ? 'PASS' : 'FAIL ' + status;
        Module.setStatus(status === 0 ? '' : 'Shovey stopped (' + status + ')');
      },
      onAbort: function(reason) {
        Module.setStatus('Could not start Shovey.');
        console.error('Shovey aborted:', reason);
      }
    };
    var runtimeScript = document.createElement('script');
    runtimeScript.async = true;
    runtimeScript.src = 'index.js?v=' + buildRevision;
    runtimeScript.onerror = function() { Module.setStatus('Could not download Shovey.'); };
    document.body.appendChild(runtimeScript);
  </script>
