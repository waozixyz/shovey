<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Play Shovey in your browser.">
  <title>Shovey</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #10231d; overflow: hidden; }
    #zib-controls { display: none; }
    #canvas-frame { width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #result { display: none; }
  </style>
</head>
<body>
  <div id="zib-controls"></div>
  <div id="canvas-frame"><canvas id="canvas"></canvas></div>
  <pre id="result">pending</pre>
  <script>
    var Module = {
      locateFile: function (path) {
        return path === "runtime.wasm" ? "index.wasm" : path;
      },
      onExit: function (status) {
        document.getElementById("result").textContent = status === 0 ? "PASS" : "FAIL " + status;
      },
      onAbort: function (reason) {
        document.getElementById("result").textContent = "ABORT " + reason;
      }
    };
  </script>
  <script async src="index.js"></script>
</body>
</html>
