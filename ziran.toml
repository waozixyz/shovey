[package]
name = "Shovey"
module_roots = ["src"]
# Kryon's Android host draws the player's Frame in src/app.zi.
bridge_modules = ["app"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "3432c0ca263e855cd6d1627d1e42e70749f5aa0b"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "894f1bc6b7a0fb0e9db6f668fe20f76581f61736"

[dependencies.apps]
git = "https://git.waozi.xyz/waozi/apps.git"
ref = "38e8fcef403e4ca271b5ffa68e9da60dfceab909"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[exports]
shovey_theme = "src/shovey_theme.zi"
rules = "src/rules.zi"

[dependencies.entity]
git = "https://git.waozi.xyz/waozi/entity.git"
ref = "3c21448152d1be12529362eb05e8c502a01f50f4"

[dependencies.crypto]
git = "https://github.com/ziranlang/crypto.git"
ref = "944826f70779a6b6cd53f6b06a75b36f4d8a2558"
