[package]
name = "Shovey"
module_roots = ["src"]
# Kryon's Android host draws the player's Frame in src/app.zi.
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "master"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[exports]
shovey_theme = "src/shovey_theme.zi"
rules = "src/rules.zi"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "master"

# The Windows player's network library, built with MinGW over Windows TLS.
[dependencies.curl]
git = "https://github.com/curl/curl.git"
ref = "19b299005fbe2d895f4ad525cfdae62a2220c3ea"
source = true
