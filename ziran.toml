[package]
name = "Shovey"
module_roots = ["src"]
# Kryon's Android host draws the player's Frame in src/app.zi.
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "e4e8efa4a92f36e2fb0cea1d56b11471afa68621"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "b5ac5d1a303326009012d68016c1d8859b6b3a13"

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "3c0a7d9e7f941381a7c07169f94240b9fe801bb8"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[exports]
shovey_theme = "src/shovey_theme.zi"
rules = "src/rules.zi"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "2c56268db0b270ad53e51af9cae5dc46876a65d9"

[dependencies.crypto]
git = "https://github.com/ziranlang/crypto.git"
ref = "944826f70779a6b6cd53f6b06a75b36f4d8a2558"
