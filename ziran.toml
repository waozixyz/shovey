bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "d17c7aa1e093066ef03f307a45f6966dd9b29d4b"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "1b290f19aa1a4069c908a4687f04458c58a2b658"

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "7854da88e219f98264dc41f1e614e4c9d292dded"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[exports]
shovey_theme = "src/shovey_theme.zi"
rules = "src/rules.zi"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "d9c0c38bf041e97959170c48d1fc408524445a34"

[dependencies.crypto]
