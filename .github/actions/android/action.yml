name: Prepare the Android build
description: >
  Install what F-Droid's recipe installs, plus Java and the Android SDK parts
  the pinned Arcade host locks, for make android-fdroid.

runs:
  using: composite
  steps:
    - name: Install the recipe's build packages
      shell: sh
      run: |
        # Only Ubuntu's own feeds: refreshing the runner's other feeds is slow.
        set -- -o Acquire::Retries=2 -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
        sudo apt-get "$@" -o APT::Get::List-Cleanup=0 update
        sudo apt-get "$@" install -y --no-install-recommends build-essential cmake pkg-config python3-pil python3-numpy libssl-dev
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Install the Android SDK parts the host locks
      shell: sh
      run: |
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$sdkmanager" --licenses > /dev/null
        "$sdkmanager" --install 'ndk;28.2.13676358' 'build-tools;36.0.0' 'platforms;android-36' 'cmake;3.22.1' > /dev/null
