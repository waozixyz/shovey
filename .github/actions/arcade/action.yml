name: Prepare Arcade
description: >
  Check out Arcade, the host that packs standalone Shovey, and the Ziran
  toolchain it locks. Arcade builds this Shovey commit; every other package
  stays at the commit Arcade locks. The published campaign's level code and
  pictures are generated, as they are not in Git.

inputs:
  revision:
    description: Arcade host revision (defaults to the Android host pin)
    required: false
  packages:
    description: Ubuntu packages the job's build and checks need
    required: true

runs:
  using: composite
  steps:
    - name: Read the pinned Arcade host
      id: host
      shell: sh
      run: |
        python3 - <<'PY'
        import json, os, re
        lock = json.load(open("waozixyz/shovey/packaging/android/ziran.lock"))
        host = next(package for package in lock["packages"]
                    if package["name"] == "host" and package["url"] == "https://github.com/waozixyz/arcade.git")
        assert re.fullmatch("[0-9a-f]{40}", host["commit"]), "Pin a full Arcade commit"
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write("revision=" + host["commit"] + "\n")
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: waozixyz/arcade
        ref: ${{ inputs.revision || steps.host.outputs.revision }}
        path: waozixyz/arcade
    # The compiler Arcade locks comes prebuilt, and Ubuntu packages from the
    # canonical archive.
    - name: Set up Arcade's locked Ziran and the build tools
      uses: ziranlang/ziran/.github/actions/setup@5d3e5ca4cae76398dd2545a0e33d2b741fe5d321
      with:
        project: waozixyz/arcade
        path: ziranlang/ziran
        packages: ${{ inputs.packages }}
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ziran/sources
        key: arcade-ziran-sources-${{ hashFiles('waozixyz/arcade/ziran.lock') }}
        restore-keys: |
          arcade-ziran-sources-
    - name: Fetch Arcade's packages
      shell: sh
      run: |
        printf '[overrides]\nshovey = "../shovey"\nziran = "../../ziranlang/ziran"\n' > waozixyz/arcade/ziran.local.toml
        cd waozixyz/arcade
        "$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran" fetch
    - name: Generate the published campaign
      shell: sh
      run: make -C waozixyz/shovey levels landscape
