name: Play online

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Full approved source commit (defaults to the triggering commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shovey-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    defaults:
      run:
        working-directory: waozixyz/shovey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: waozixyz/shovey
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Validate the requested source
        id: source
        env:
          SHOVEY_REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$SHOVEY_REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full source commit is required' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHOVEY_REQUESTED_REVISION"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then git merge-base --is-ancestor HEAD origin/master; fi
          echo "revision=$SHOVEY_REQUESTED_REVISION" >> "$GITHUB_OUTPUT"
      - name: Read the locked toolchain
        id: toolchain
        run: |
          python3 -c 'import json,os; r=json.load(open("ziran.lock")); open(os.environ["GITHUB_OUTPUT"],"a").write("commit="+r["toolchain"]["commit"]+"\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ziranlang/ziran
          ref: ${{ steps.toolchain.outputs.commit }}
          path: ziranlang/ziran
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: |
          if command -v cc >/dev/null && command -v c++ >/dev/null && \
             command -v make >/dev/null && command -v cmake >/dev/null && command -v rg >/dev/null && \
             command -v pkg-config >/dev/null && pkg-config --exists libcurl && python3 -c 'import PIL, numpy'; then
            echo 'Required build tools and image packages are already available.'
          else
            sh "$GITHUB_WORKSPACE/ziranlang/ziran/scripts/ci_packages.sh" build-essential cmake ripgrep pkg-config libcurl4-openssl-dev python3-pil python3-numpy
          fi
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
          actions-cache-folder: emsdk-cache
      - name: Build the locked compiler and fetch packages
        run: |
          make -j2 -C "$GITHUB_WORKSPACE/ziranlang/ziran"
          "$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran" fetch --locked
      - name: Check the game and build its ZX web edition
        run: |
          make public-test ZIRAN="$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran"
          make web-zx ZIRAN="$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran"
      # The profile and the live campaign still need the ZX player.
      - name: Play the ZX edition in a private browser
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_profile_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 WEB_FAIL_STORAGE=1 node tests/web_profile_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_live_campaign_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_selector_latest_test.mjs
      - name: Build the campaign publication client
        run: |
          # Emscripten adds its tools to PATH; use the runner's native build tools.
          export PATH="/usr/bin:/bin:$PATH"
          cmake --version
          entity=$("$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran" pkg path entity --locked)
          make -j1 -C "$entity" publication ZIRAN="$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran"
          mkdir -p build/campaign-publisher
          cp "$entity/build/publication" build/campaign-publisher/publication
          cp build/solver/shovey-solve-classic build/campaign-publisher/shovey-solve-classic
          python3 scripts/publish-campaign.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-publisher
          path: waozixyz/shovey/build/campaign-publisher
          if-no-files-found: error
          retention-days: 1
      # The website serves the game compiled to WebAssembly, which stays
      # smooth on slow phones.
      - name: Build the compiled web game
        run: make web ZIRAN="$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran"
      - name: Play the compiled game in a private browser
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_assets_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_mini_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_tap_beside_board_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_copy_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_live_campaign_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_selector_latest_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shovey-web
          path: waozixyz/shovey/build/web
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-check
          path: waozixyz/shovey/build/web-test
          retention-days: 1

  campaign:
    name: Update live levels
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: campaign-server
      url: https://api.waozi.xyz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build.outputs.revision }}
      - name: Publish only the current master
        id: current
        env:
          SOURCE_REVISION: ${{ needs.build.outputs.revision }}
        run: |
          git fetch origin master
          if [ "$(git rev-parse origin/master)" = "$SOURCE_REVISION" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer master superseded this campaign; its run will publish the levels.'
          fi
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: campaign-publisher
          path: build/campaign-publisher
      - name: Publish and verify the approved campaign
        if: steps.current.outputs.publish == 'true'
        env:
          CAMPAIGN_KEY: ${{ secrets.SHOVEY_CAMPAIGN_KEY }}
        run: |
          test -n "$CAMPAIGN_KEY" || { echo '::error::Set SHOVEY_CAMPAIGN_KEY to the existing campaign publisher key.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/shovey-campaign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$CAMPAIGN_KEY" > "$key"
          chmod +x build/campaign-publisher/publication build/campaign-publisher/shovey-solve-classic
          python3 scripts/publish-campaign.py --key-file "$key" --solver build/campaign-publisher/shovey-solve-classic

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-pages
      url: https://shovey.waozi.xyz
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shovey-web
          path: build/web
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=shovey --branch=master --commit-hash=${{ needs.build.outputs.revision }}

  itch:
    name: Publish itch.io
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: itch-io
      url: https://waozi.itch.io/shovey
    steps:
      - name: Check itch.io credential
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo '::error::Set the ITCH_API_KEY repository secret to enable automatic itch.io updates.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: shovey-web
          path: build/web
      - name: Install Butler
        run: |
          curl --fail --show-error --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$RUNNER_TEMP/butler.zip"
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Publish the tested browser build
        env:
          SHOVEY_SOURCE_REVISION: ${{ needs.build.outputs.revision }}
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          version=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('build/web')
          build = json.loads((root / 'build.json').read_text())
          assert build['revision'] == os.environ['SHOVEY_SOURCE_REVISION'], 'The web artifact belongs to another revision'
          for name in ('index.html', 'index.js', 'index.wasm', 'index.data'):
              assert (root / name).is_file(), f'Missing web asset: {name}'
          print(build['version'] + '-' + build['revision'])
          PY
          )
          butler push build/web waozi/shovey:html5 --userversion "$version"
