name: Play online

# shovey.waozi.xyz is the released game: the newest published release's own
# shovey.zx, shovey.json and entity.zx, in Shovey's player compiled for the
# browser, with their programs compiled into the page (scripts/build-site.py).
# Pushes rebuild it, and so does each finished Downloads run that published a
# new version.
on:
  push:
    branches: [master]
  pull_request:
  workflow_run:
    workflows: [Downloads]
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Full approved source commit (defaults to the triggering commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shovey-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    defaults:
      run:
        working-directory: waozixyz/shovey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: waozixyz/shovey
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Validate the requested source
        id: source
        env:
          SHOVEY_REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$SHOVEY_REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full source commit is required' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHOVEY_REQUESTED_REVISION"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then git merge-base --is-ancestor HEAD origin/master; fi
          echo "revision=$SHOVEY_REQUESTED_REVISION" >> "$GITHUB_OUTPUT"
      # The locked compiler comes prebuilt, the package checkouts cached, and
      # Ubuntu packages from the canonical archive.
      - name: Set up the locked Ziran, its packages and the build tools
        uses: ziranlang/ziran/.github/actions/setup@979159a55bcf1f9edb9eb8f26ea10aca421412e2
        with:
          project: waozixyz/shovey
          path: ziranlang/ziran
          fetch: true
          packages: build-essential cmake ripgrep pkg-config libcurl4-openssl-dev python3-pil python3-numpy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
          actions-cache-folder: emsdk-cache
      - name: Check the game and build its ZX web edition
        run: |
          make public-test ZIRAN="$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran"
          make web-zx ZIRAN="$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran"
      # The profile and the live campaign still need the ZX player.
      - name: Play the ZX edition in a private browser
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_profile_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 WEB_FAIL_STORAGE=1 node tests/web_profile_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_live_campaign_test.mjs
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_selector_latest_test.mjs
      - name: Build the campaign publication client
        run: |
          # Emscripten adds its tools to PATH; use the runner's native build tools.
          export PATH="/usr/bin:/bin:$PATH"
          cmake --version
          entity=$("$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran" pkg path entity --locked)
          make -j1 -C "$entity" publication ZIRAN="$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran"
          mkdir -p build/campaign-publisher
          cp "$entity/build/publication" build/campaign-publisher/publication
          cp build/solver/shovey-solve-classic build/campaign-publisher/shovey-solve-classic
          python3 scripts/publish-campaign.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-publisher
          path: waozixyz/shovey/build/campaign-publisher
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-check
          path: waozixyz/shovey/build/web-test
          retention-days: 1

  site:
    name: Build the site from the newest release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.due.outputs.publish }}
      version: ${{ steps.due.outputs.version }}
    defaults:
      run:
        working-directory: waozixyz/shovey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: waozixyz/shovey
          ref: ${{ github.event_name == 'workflow_run' && 'master' || inputs.revision || github.sha }}
      - name: Check for a release the site does not have yet
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo waozixyz/shovey --limit 20 --exclude-drafts --json tagName,isPrerelease \
            -q '[.[] | select(.isPrerelease | not) | .tagName | select(startswith("v"))][0]')
          test -n "$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          live=$(curl -fsS https://shovey.waozi.xyz/build.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' || true)
          # The site changes with each release; a manual run rebuilds it anyway.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$live" = "${tag#v}" ]; then
            echo "::notice title=Site::shovey.waozi.xyz already runs Shovey $live"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      # The player is built from this checkout's lock; the locked compiler
      # comes prebuilt and Ubuntu packages from the canonical archive.
      - name: Set up the locked Ziran, its packages and the build tools
        if: steps.due.outputs.publish == 'true'
        uses: ziranlang/ziran/.github/actions/setup@979159a55bcf1f9edb9eb8f26ea10aca421412e2
        with:
          project: waozixyz/shovey
          path: ziranlang/ziran
          fetch: true
          packages: build-essential cmake pkg-config python3-pil
      - uses: actions/setup-node@v4
        if: steps.due.outputs.publish == 'true'
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.due.outputs.publish == 'true'
        with:
          version: '6.0.6'
          actions-cache-folder: emsdk-cache
      - name: Build the site from the release
        if: steps.due.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-site.py --tag "v${{ steps.due.outputs.version }}" --output build/web-site
      - name: Play the release in a private browser
        if: steps.due.outputs.publish == 'true'
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY YUE_DESKTOP_RECOVERY=0 node tests/web_release_test.mjs build/web-site
      - uses: actions/upload-artifact@v4
        if: steps.due.outputs.publish == 'true'
        with:
          name: shovey-site
          path: waozixyz/shovey/build/web-site
          if-no-files-found: error
          retention-days: 1

  campaign:
    name: Update live levels
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: campaign-server
      url: https://api.waozi.xyz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build.outputs.revision }}
      - name: Publish only the current master
        id: current
        env:
          SOURCE_REVISION: ${{ needs.build.outputs.revision }}
        run: |
          git fetch origin master
          if [ "$(git rev-parse origin/master)" = "$SOURCE_REVISION" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer master superseded this campaign; its run will publish the levels.'
          fi
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: campaign-publisher
          path: build/campaign-publisher
      - name: Publish and verify the approved campaign
        if: steps.current.outputs.publish == 'true'
        env:
          CAMPAIGN_KEY: ${{ secrets.SHOVEY_CAMPAIGN_KEY }}
        run: |
          test -n "$CAMPAIGN_KEY" || { echo '::error::Set SHOVEY_CAMPAIGN_KEY to the existing campaign publisher key.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/shovey-campaign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$CAMPAIGN_KEY" > "$key"
          chmod +x build/campaign-publisher/publication build/campaign-publisher/shovey-solve-classic
          python3 scripts/publish-campaign.py --key-file "$key" --solver build/campaign-publisher/shovey-solve-classic

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.site.outputs.publish == 'true'
    needs: site
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-pages
      url: https://shovey.waozi.xyz
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shovey-site
          path: build/web-site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web-site --project-name=shovey --branch=master --commit-hash=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Check that shovey.waozi.xyz serves the release
        env:
          VERSION: ${{ needs.site.outputs.version }}
        run: |
          for attempt in $(seq 30); do
            live=$(curl -fsS -H 'Cache-Control: no-cache' "https://shovey.waozi.xyz/build.json?$attempt" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' || true)
            test "$live" = "$VERSION" && curl -fsS -o /dev/null https://shovey.waozi.xyz/runtime.wasm && exit 0
            sleep 10
          done
          echo "::error::shovey.waozi.xyz serves '$live', not Shovey $VERSION"
          exit 1

  itch:
    name: Publish itch.io
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.site.outputs.publish == 'true'
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: itch-io
      url: https://waozi.itch.io/shovey
    steps:
      - name: Check itch.io credential
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo '::error::Set the ITCH_API_KEY repository secret to enable automatic itch.io updates.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: shovey-site
          path: build/web-site
      - name: Install Butler
        run: |
          curl --fail --show-error --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$RUNNER_TEMP/butler.zip"
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Publish the tested browser build
        env:
          SHOVEY_VERSION: ${{ needs.site.outputs.version }}
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('build/web-site')
          build = json.loads((root / 'build.json').read_text())
          assert build['version'] == os.environ['SHOVEY_VERSION'], 'The site artifact belongs to another release'
          for name in ('index.html', 'arcade.json', 'runtime.js', 'runtime.wasm', 'runtime.data'):
              assert (root / name).is_file(), f'Missing web asset: {name}'
          PY
          butler push build/web-site waozi/shovey:html5 --userversion "$SHOVEY_VERSION"
