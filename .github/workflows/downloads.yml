name: Downloads
run-name: Shovey build ${{ inputs.revision || github.sha }}

# Gitea requests an exact source commit. These jobs build/sign every edition,
# reproduce the F-Droid APK and play the Linux/Windows downloads. Gitea's
# Downloads workflow publishes our own edition; the F-Droid and Google Play
# editions this workflow builds are attached to the mirrored GitHub release,
# and play-bundle.yml sends the bundle to Google Play.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full approved source commit (defaults to the triggering commit)
        required: false
        type: string
      rehearse:
        description: Build and play every download without publishing a release
        required: false
        type: boolean
        default: false
  release:
    # A published Shovey release gets its editions attached; editor releases
    # share this repository and are ignored below.
    types: [published]

permissions:
  contents: read

concurrency:
  group: shovey-downloads
  cancel-in-progress: false

jobs:
  due:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_due: ${{ steps.due.outputs.release_due }}
      build_due: ${{ steps.due.outputs.build_due }}
      version: ${{ steps.due.outputs.version }}
      revision: ${{ steps.due.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Release only a new version or a requested run
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          REHEARSE: ${{ inputs.rehearse || false }}
        run: |
          [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full source commit is required' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$REQUESTED_REVISION"
          git merge-base --is-ancestor HEAD origin/master
          echo "revision=$REQUESTED_REVISION" >> "$GITHUB_OUTPUT"
          version=$(python3 -c 'import re; print(re.search(r"^## \[([0-9.]+)\]", open("src/CHANGELOG.md").read(), re.M)[1])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Gitea's Downloads workflow publishes and mirrors our own edition.
          # These jobs build the F-Droid and Google Play editions and attach
          # them to the mirrored GitHub release.
          echo "release_due=false" >> "$GITHUB_OUTPUT"
          echo "build_due=true" >> "$GITHUB_OUTPUT"

  android:
    needs: due
    if: needs.due.outputs.build_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.due.outputs.revision }}
      - uses: ./.github/actions/android
      # Only the Google Play edition may name a Google library, in its build
      # files as in its APK.
      - name: Keep Google libraries out of the normal and F-Droid build files
        uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
      # The build F-Droid's recipe runs; it has no self-update, so one APK
      # serves both.
      # The build's own Ziran cache (compiler, package checkouts and native
      # libraries) is addressed by what it is built from; reuse it between
      # runs with the same lock instead of rebuilding the compiler each time.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/fdroid/cache/ziran
          key: shovey-android-ubuntu-24.04-${{ hashFiles('ziran.lock') }}
      - name: Build the release APK
        run: make android-fdroid
      - name: Keep Google libraries out of the normal and F-Droid APK
        uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
        with:
          packages: build/fdroid/shovey.apk
          source: ''
      - name: Sign and check the APK
        env:
          KEYSTORE: ${{ secrets.SHOVEY_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.SHOVEY_ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.due.outputs.version }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/shovey-release.p12"
          printf '%s\n' "$PASSWORD" > "$RUNNER_TEMP/password"
          python3 scripts/android-release.py sign build/fdroid/shovey.apk --version "$VERSION" \
            --keystore "$RUNNER_TEMP/shovey-release.p12" --password-file "$RUNNER_TEMP/password" \
            --output "build/downloads/shovey-v$VERSION.apk"
          rm -f "$RUNNER_TEMP/shovey-release.p12" "$RUNNER_TEMP/password"
          cp "build/downloads/shovey-v$VERSION.apk" "build/downloads/shovey-$VERSION-fdroid.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-android
          path: build/downloads/*.apk
          if-no-files-found: error
          retention-days: 7

  android-gplay:
    needs: due
    if: needs.due.outputs.build_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.due.outputs.revision }}
      - uses: ./.github/actions/android
      # The build's own Ziran cache (compiler, package checkouts and native
      # libraries) is addressed by what it is built from; reuse it between
      # runs with the same lock instead of rebuilding the compiler each time.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/fdroid/cache/ziran
          key: shovey-android-gplay-ubuntu-24.04-${{ hashFiles('ziran.lock') }}
      - name: Build the Google Play edition's APK
        run: make android-gplay
      # The Google check must still recognise Play Billing, or its passes on
      # the other editions prove nothing.
      - name: Find Play Billing in the Google Play APK
        uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
        with:
          packages: build/fdroid/shovey-gplay.apk
          source: ''
          expect-google: 'true'
      - name: Sign and check the APK
        env:
          KEYSTORE: ${{ secrets.SHOVEY_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.SHOVEY_ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.due.outputs.version }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/shovey-release.p12"
          printf '%s\n' "$PASSWORD" > "$RUNNER_TEMP/password"
          python3 scripts/android-release.py sign build/fdroid/shovey-gplay.apk --edition gplay --version "$VERSION" \
            --keystore "$RUNNER_TEMP/shovey-release.p12" --password-file "$RUNNER_TEMP/password" \
            --output "build/downloads/shovey-v$VERSION-gplay.apk"
          rm -f "$RUNNER_TEMP/shovey-release.p12" "$RUNNER_TEMP/password"
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-android-gplay
          path: build/downloads/*.apk
          if-no-files-found: error
          retention-days: 7

  editions:
    name: Attach the F-Droid and Google Play editions
    needs: [due, android, android-gplay]
    if: needs.due.outputs.build_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shovey-android*
          path: build/downloads
          merge-multiple: true
      - name: Attach them to the mirrored release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.due.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # Gitea publishes the release and mirrors it here with our own
          # edition; only the two editions this workflow builds are added.
          state=$(gh release view "$tag" --json isDraft --jq .isDraft) || {
            echo "::error::GitHub release $tag is not published yet; run this after Gitea publishes and mirrors it." >&2
            exit 1
          }
          test "$state" = false || { echo "::error::GitHub release $tag is still a draft." >&2; exit 1; }
          present=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for file in "build/downloads/shovey-$VERSION-fdroid.apk" "build/downloads/shovey-v$VERSION-gplay.apk"; do
            name=$(basename "$file")
            test -f "$file"
            if grep -qxF "$name" <<<"$present"; then
              echo "$name is already attached to $tag"
            else
              gh release upload "$tag" "$file"
            fi
          done

  fdroid:
    needs: due
    # A published release only needs the Android editions; the F-Droid
    # rebuild and the desktop play-tests belong to a manual run.
    if: github.event_name == 'workflow_dispatch' && needs.due.outputs.build_due == 'true'
    uses: ./.github/workflows/fdroid.yml
    with:
      revision: ${{ needs.due.outputs.revision }}

  linux:
    needs: due
    if: github.event_name == 'workflow_dispatch' && needs.due.outputs.build_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: waozixyz/shovey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.due.outputs.revision }}
          path: waozixyz/shovey
      # The locked compiler comes prebuilt, the package checkouts cached, and
      # Ubuntu packages from the canonical archive.
      - name: Set up the locked Ziran, its packages and the build tools
        uses: ziranlang/ziran/.github/actions/setup@120e6d967c7c06594c53ae3dce490f4d64a4ea4c
        with:
          project: waozixyz/shovey
          path: ziranlang/ziran
          fetch: true
          packages: >-
            build-essential cmake meson ninja-build pkg-config python3-pil python3-numpy libsdl2-dev libcairo2-dev
            libfreetype-dev libfontconfig-dev libpango1.0-dev libgtk-3-dev libcurl4-openssl-dev
            libx11-dev nasm xvfb xauth xdotool imagemagick
      # The UI tests drive the player through Inner Breeze's test driver client.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: waozixyz/breeze
          ref: fa9c8acab237278d81c9929fa97b3f2545842310
          path: waozixyz/breeze
          sparse-checkout: tests/ui_driver.py
          sparse-checkout-cone-mode: false
      # Ziran addresses built native libraries (codecs, SDL, Cairo, curl, liboqs)
      # by everything they are built from, so a run with the same lock and
      # runner image reuses them and any change rebuilds them.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ~/.cache/ziran/artifacts
          key: shovey-native-linux-ubuntu-24.04-${{ hashFiles('waozixyz/shovey/ziran.lock') }}
          restore-keys: shovey-native-linux-ubuntu-24.04-
      - name: Build and pack the Linux download
        run: make player-linux
      # Preserve successful compilation even if a later play-test fails.
      # Ziran verifies each restored artifact against its own inputs/digests.
      - name: Save the Linux native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ziran/artifacts
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Unpack the download
        id: unpack
        run: |
          rm -rf build/linux-check
          mkdir -p build/linux-check
          tar -xzf build/downloads/shovey-v*-linux-x86_64.tar.gz -C build/linux-check
          # The shipped tarball omits Kryon's test driver; rebuild only the host
          # binary with KRYON_TEST_DRIVER=1 so UI tests drive the unpacked files.
          KRYON_TEST_DRIVER=1 python3 -c "import sys; sys.path.insert(0, 'scripts'); import player; player.linux_host()"
          install -m 0755 build/player/linux/shovey build/linux-check/shovey/shovey
      # Each play-test runs even when an earlier one fails, so one run shows
      # every failure.
      - name: Play the unpacked download on a private display
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            YUE_DESKTOP_RECOVERY=0 SDL_AUDIODRIVER=dummy timeout 300s xvfb-run -a -n 400 -s '-screen 0 1280x1000x24' \
            python3 tests/shovey_standalone_ui_test.py --binary "$PWD/build/linux-check/shovey/shovey" \
            --inbe-source "$GITHUB_WORKSPACE/waozixyz/breeze"
      - name: Open local Classic and Profile with downloads off
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          env -u LISTEN_PID -u LISTEN_FDS -u LISTEN_FDNAMES -u NOTIFY_SOCKET -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            YUE_DESKTOP_RECOVERY=0 SDL_AUDIODRIVER=dummy timeout 180s xvfb-run -a -n 400 -s '-screen 0 1024x900x24' \
            python3 tests/player_local_ui_test.py --binary "$PWD/build/linux-check/shovey/shovey" \
            --driver-source "$GITHUB_WORKSPACE/waozixyz/breeze/tests"
      - name: Press bundled Island's Unlock in English and German
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          env -u LISTEN_PID -u LISTEN_FDS -u LISTEN_FDNAMES -u NOTIFY_SOCKET -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            YUE_DESKTOP_RECOVERY=0 SDL_AUDIODRIVER=dummy timeout 180s xvfb-run -a -n 400 -s '-screen 0 1024x900x24' \
            python3 tests/island_buy_ui_test.py --binary "$PWD/build/linux-check/shovey/shovey" \
            --driver-source "$GITHUB_WORKSPACE/waozixyz/breeze"
      - name: Reopen unclaimed and empty chests in the packaged game
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          make chest-fixture
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            YUE_DESKTOP_RECOVERY=0 SDL_AUDIODRIVER=dummy timeout 180s xvfb-run -a -n 400 -s '-screen 0 1280x1000x24' \
            python3 tests/chest_ui_test.py --binary "$PWD/build/linux-check/shovey/shovey" \
            --fixture build/chest-test/fixture.txt --driver-source "$GITHUB_WORKSPACE/waozixyz/breeze" \
            --output build/chest-ui-test
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-linux
          path: waozixyz/shovey/build/downloads/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: due
    if: github.event_name == 'workflow_dispatch' && needs.due.outputs.build_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: waozixyz/shovey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.due.outputs.revision }}
          path: waozixyz/shovey
      - name: Set up the locked Ziran, its packages and the build tools
        uses: ziranlang/ziran/.github/actions/setup@120e6d967c7c06594c53ae3dce490f4d64a4ea4c
        with:
          project: waozixyz/shovey
          path: ziranlang/ziran
          fetch: true
          packages: >-
            build-essential cmake meson ninja-build pkg-config python3-pil python3-numpy gcc-mingw-w64-x86-64-win32
            g++-mingw-w64-x86-64-win32
            binutils-mingw-w64-x86-64 libz-mingw-w64-dev nasm wine wine64 xvfb xauth unzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: waozixyz/breeze
          ref: fa9c8acab237278d81c9929fa97b3f2545842310
          path: waozixyz/breeze
          sparse-checkout: tests/ui_driver.py
          sparse-checkout-cone-mode: false
      # Ziran addresses built native libraries (codecs, SDL, Cairo, curl, liboqs)
      # by everything they are built from, so a run with the same lock and
      # runner image reuses them and any change rebuilds them.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ~/.cache/ziran/artifacts
          key: shovey-native-windows-ubuntu-24.04-${{ hashFiles('waozixyz/shovey/ziran.lock') }}
          restore-keys: shovey-native-windows-ubuntu-24.04-
      - name: Cross-build and pack the Windows download
        env:
          CXX: x86_64-w64-mingw32-g++
        run: make player-windows
      - name: Save the Windows native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ziran/artifacts
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-windows
          path: waozixyz/shovey/build/downloads/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Play the unpacked download under Wine on a private display
        run: |
          rm -rf build/windows-check
          mkdir -p build/windows-check
          unzip -q build/downloads/shovey-v*-windows-x86_64.zip -d build/windows-check
          # The shipped zip omits Kryon's test driver; rebuild only the host
          # binary with KRYON_TEST_DRIVER=1 so Wine UI tests drive the unpacked files.
          KRYON_TEST_DRIVER=1 CXX=x86_64-w64-mingw32-g++ python3 -c "import sys; sys.path.insert(0, 'scripts'); import player; player.windows_host('x86_64-w64-mingw32-')"
          install -m 0755 build/player/windows/shovey.exe build/windows-check/Shovey/shovey.exe
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            WINEPREFIX="$RUNNER_TEMP/wine" timeout 900s xvfb-run -a -n 400 -s '-screen 0 1280x1000x24' \
            python3 tests/shovey_windows_ui_test.py --program "$PWD/build/windows-check/Shovey/shovey.exe" \
            --inbe-source "$GITHUB_WORKSPACE/waozixyz/breeze"
      - name: Preserve private Windows test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-diagnostics
          path: waozixyz/shovey/build/shovey-windows-ui-test/
          if-no-files-found: ignore
          retention-days: 7
