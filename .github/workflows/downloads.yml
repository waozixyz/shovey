name: Downloads

# A push whose changelog names a version that is not released yet builds and
# checks the signed Android APK, also published as shovey-VERSION-fdroid.apk
# once F-Droid's own build of the commit matches it, and the Linux and Windows
# downloads, then publishes them as that version's release, like Inner
# Breeze. Pushes of a released version only check that nothing needs
# releasing. A manual run retries an unreleased version. No release is left as
# a draft.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shovey-downloads
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_due: ${{ steps.due.outputs.release_due }}
      version: ${{ steps.due.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Release only a new version or a requested run
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import re; print(re.search(r"^## \[([0-9.]+)\]", open("src/CHANGELOG.md").read(), re.M)[1])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          state=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" != false ]; then
            echo "release_due=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_due=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Downloads::Shovey $version is already released; its downloads build again with the next changelog version"
          fi

  android:
    needs: due
    if: needs.due.outputs.release_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/android
      # The build F-Droid's recipe runs, from the Arcade host pinned in
      # packaging/android; it has no self-update, so one APK serves both.
      - name: Build the release APK
        run: make android-fdroid
      - name: Sign and check the APK
        env:
          KEYSTORE: ${{ secrets.SHOVEY_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.SHOVEY_ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.due.outputs.version }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/shovey-release.p12"
          printf '%s\n' "$PASSWORD" > "$RUNNER_TEMP/password"
          python3 scripts/android-release.py sign build/fdroid/shovey.apk --version "$VERSION" \
            --keystore "$RUNNER_TEMP/shovey-release.p12" --password-file "$RUNNER_TEMP/password" \
            --output "build/downloads/shovey-v$VERSION.apk"
          rm -f "$RUNNER_TEMP/shovey-release.p12" "$RUNNER_TEMP/password"
          cp "build/downloads/shovey-v$VERSION.apk" "build/downloads/shovey-$VERSION-fdroid.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-android
          path: build/downloads/*.apk
          if-no-files-found: error
          retention-days: 7

  fdroid:
    needs: due
    if: needs.due.outputs.release_due == 'true'
    uses: ./.github/workflows/fdroid.yml
    with:
      revision: ${{ github.sha }}

  linux:
    needs: due
    if: needs.due.outputs.release_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: waozixyz/arcade
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: waozixyz/shovey
      - uses: ./waozixyz/shovey/.github/actions/arcade
        with:
          packages: >-
            build-essential cmake pkg-config python3-pil python3-numpy libsdl2-dev libcairo2-dev
            libfreetype-dev libfontconfig-dev libpango1.0-dev libgtk-3-dev libcurl4-openssl-dev
            libx11-dev xvfb xauth xdotool imagemagick
      - name: Build and pack the Linux download
        run: make shovey-linux-download
      - name: Play the unpacked download on a private display
        run: |
          rm -rf build/linux-check
          mkdir -p build/linux-check
          tar -xzf build/downloads/shovey-v*-linux-x86_64.tar.gz -C build/linux-check
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            YUE_DESKTOP_RECOVERY=0 SDL_AUDIODRIVER=dummy timeout 240s xvfb-run -a -n 400 -s '-screen 0 1280x1000x24' \
            python3 tests/shovey_standalone_ui_test.py --binary "$PWD/build/linux-check/shovey/shovey" \
            --inbe-source "$(./scripts/ziran.sh pkg path inbe)"
      - name: Reopen unclaimed and empty chests in the packaged game
        run: |
          make -C ../shovey chest-fixture
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            YUE_DESKTOP_RECOVERY=0 SDL_AUDIODRIVER=dummy timeout 180s xvfb-run -a -n 400 -s '-screen 0 1280x1000x24' \
            python3 ../shovey/tests/chest_ui_test.py --binary "$PWD/build/linux-check/shovey/shovey" \
            --fixture ../shovey/build/chest-test/fixture.txt --driver-source "$(./scripts/ziran.sh pkg path inbe)" \
            --output build/chest-ui-test
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-linux
          path: waozixyz/arcade/build/downloads/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: due
    if: needs.due.outputs.release_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: waozixyz/arcade
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: waozixyz/shovey
      - uses: ./waozixyz/shovey/.github/actions/arcade
        with:
          packages: >-
            build-essential cmake pkg-config python3-pil python3-numpy gcc-mingw-w64-x86-64-win32
            binutils-mingw-w64-x86-64 libz-mingw-w64-dev wine wine64 xvfb xauth unzip
      - name: Cross-build and pack the Windows download
        run: make shovey-windows-download
      - name: Play the unpacked download under Wine on a private display
        run: |
          rm -rf build/windows-check
          mkdir -p build/windows-check
          unzip -q build/downloads/shovey-v*-windows-x86_64.zip -d build/windows-check
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            WINEPREFIX="$RUNNER_TEMP/wine" timeout 900s xvfb-run -a -n 400 -s '-screen 0 1280x1000x24' \
            python3 tests/shovey_windows_ui_test.py --program "$PWD/build/windows-check/Shovey/shovey.exe" \
            --inbe-source "$(./scripts/ziran.sh pkg path inbe)"
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-windows
          path: waozixyz/arcade/build/downloads/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [due, android, fdroid, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: waozixyz/shovey
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANGELOG_VERSION: ${{ needs.due.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: waozixyz/shovey
      - uses: actions/download-artifact@v4
        with:
          pattern: shovey-*
          path: waozixyz/shovey/build/downloads
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: fdroid-unsigned
          path: waozixyz/shovey/build/fdroid-rebuild
      - name: Check every download is this version
        id: version
        run: |
          apk=$(ls build/downloads/shovey-v*.apk)
          version=${apk##*/shovey-v}
          version=${version%.apk}
          for file in "shovey-v$version.apk" "shovey-$version-fdroid.apk" "shovey-v$version-linux-x86_64.tar.gz" "shovey-v$version-windows-x86_64.zip"; do
            test -f "build/downloads/$file" || { echo "Missing $file" >&2; exit 1; }
          done
          test "$(ls build/downloads | wc -l)" = 4 || { ls build/downloads >&2; echo 'Downloads differ in version' >&2; exit 1; }
          test "$version" = "$CHANGELOG_VERSION" || { echo "The downloads are $version but the changelog names $CHANGELOG_VERSION" >&2; exit 1; }
          python3 scripts/android-release.py verify "build/downloads/shovey-v$version.apk" --version "$version"
          python3 scripts/android-release.py verify "build/downloads/shovey-$version-fdroid.apk" --version "$version"
          # F-Droid copies this signature onto its own build of the recipe, so
          # that rebuild must match the signed APK byte for byte.
          sudo apt-get update
          sudo apt-get install -y apksigcopier
          rebuilt=$(find build/fdroid-rebuild/tmp -name '*.apk')
          test "$(printf '%s\n' "$rebuilt" | wc -l)" = 1
          # apksigcopier runs apksigner, which the runner keeps in the
          # Android SDK's build-tools rather than on PATH.
          tools=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          PATH="$tools:$PATH" apksigcopier compare --unsigned "build/downloads/shovey-$version-fdroid.apk" "$rebuilt"
          python3 - "$version" > build/release-notes.md <<'PY'
          import re, sys
          text = open('src/CHANGELOG.md').read()
          section = re.search(r'^## \[' + re.escape(sys.argv[1]) + r'\] - .*?\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          print(section[1].strip())
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo "Shovey $VERSION is already published; its downloads stay as they are."
            exit 0
          fi
          # The downloads go up on a draft first, so the release appears
          # only once all three are there.
          if [ "$state" = missing ]; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Shovey $VERSION" --notes-file build/release-notes.md
          else
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file build/release-notes.md
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$tag" "$asset" --yes
            done
          fi
          gh release upload "$tag" build/downloads/*
          gh release edit "$tag" --draft=false --latest
          echo "Published Shovey $VERSION."
