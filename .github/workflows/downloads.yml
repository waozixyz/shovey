name: Downloads

# A push whose changelog names a version that is not released yet builds and
# checks the signed Android APK, also published as shovey-VERSION-fdroid.apk
# once F-Droid's own build of the commit matches it, the Google Play edition's
# APK (shovey-vVERSION-gplay.apk, the only one with a Google library), and the
# Linux and Windows downloads, then publishes them as that version's release,
# like Inner Breeze. Every download is Shovey's player (scripts/player.py), built from
# this repository's own lock; Arcade follows the release afterwards. Pushes of
# a released version only check that nothing needs releasing. A manual run
# retries an unreleased version. No release is left as a draft.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      revision:
        description: Full approved source commit (defaults to the triggering commit)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: shovey-downloads
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_due: ${{ steps.due.outputs.release_due }}
      version: ${{ steps.due.outputs.version }}
      revision: ${{ steps.due.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Release only a new version or a requested run
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full source commit is required' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$REQUESTED_REVISION"
          git merge-base --is-ancestor HEAD origin/master
          echo "revision=$REQUESTED_REVISION" >> "$GITHUB_OUTPUT"
          version=$(python3 -c 'import re; print(re.search(r"^## \[([0-9.]+)\]", open("src/CHANGELOG.md").read(), re.M)[1])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          state=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" != false ]; then
            echo "release_due=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_due=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Downloads::Shovey $version is already released; its downloads build again with the next changelog version"
          fi

  android:
    needs: due
    if: needs.due.outputs.release_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.due.outputs.revision }}
      - uses: ./.github/actions/android
      # Only the Google Play edition may name a Google library, in its build
      # files as in its APK.
      - name: Keep Google libraries out of the normal and F-Droid build files
        uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
      # The build F-Droid's recipe runs; it has no self-update, so one APK
      # serves both.
      - name: Build the release APK
        run: make android-fdroid
      - name: Keep Google libraries out of the normal and F-Droid APK
        uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
        with:
          packages: build/fdroid/shovey.apk
          source: ''
      - name: Sign and check the APK
        env:
          KEYSTORE: ${{ secrets.SHOVEY_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.SHOVEY_ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.due.outputs.version }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/shovey-release.p12"
          printf '%s\n' "$PASSWORD" > "$RUNNER_TEMP/password"
          python3 scripts/android-release.py sign build/fdroid/shovey.apk --version "$VERSION" \
            --keystore "$RUNNER_TEMP/shovey-release.p12" --password-file "$RUNNER_TEMP/password" \
            --output "build/downloads/shovey-v$VERSION.apk"
          rm -f "$RUNNER_TEMP/shovey-release.p12" "$RUNNER_TEMP/password"
          cp "build/downloads/shovey-v$VERSION.apk" "build/downloads/shovey-$VERSION-fdroid.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-android
          path: build/downloads/*.apk
          if-no-files-found: error
          retention-days: 7

  android-gplay:
    needs: due
    if: needs.due.outputs.release_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.due.outputs.revision }}
      - uses: ./.github/actions/android
      - name: Build the Google Play edition's APK
        run: make android-gplay
      # The Google check must still recognise Play Billing, or its passes on
      # the other editions prove nothing.
      - name: Find Play Billing in the Google Play APK
        uses: kryonlabs/kryon/.github/actions/google-free@7217475dfa7f462939e47e3f0bc918aef248b179
        with:
          packages: build/fdroid/shovey-gplay.apk
          source: ''
          expect-google: 'true'
      - name: Sign and check the APK
        env:
          KEYSTORE: ${{ secrets.SHOVEY_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.SHOVEY_ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.due.outputs.version }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/shovey-release.p12"
          printf '%s\n' "$PASSWORD" > "$RUNNER_TEMP/password"
          python3 scripts/android-release.py sign build/fdroid/shovey-gplay.apk --edition gplay --version "$VERSION" \
            --keystore "$RUNNER_TEMP/shovey-release.p12" --password-file "$RUNNER_TEMP/password" \
            --output "build/downloads/shovey-v$VERSION-gplay.apk"
          rm -f "$RUNNER_TEMP/shovey-release.p12" "$RUNNER_TEMP/password"
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-android-gplay
          path: build/downloads/*.apk
          if-no-files-found: error
          retention-days: 7

  fdroid:
    needs: due
    if: needs.due.outputs.release_due == 'true'
    uses: ./.github/workflows/fdroid.yml
    with:
      revision: ${{ needs.due.outputs.revision }}

  linux:
    needs: due
    if: needs.due.outputs.release_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: waozixyz/shovey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.due.outputs.revision }}
          path: waozixyz/shovey
      # The locked compiler comes prebuilt, the package checkouts cached, and
      # Ubuntu packages from the canonical archive.
      - name: Set up the locked Ziran, its packages and the build tools
        uses: ziranlang/ziran/.github/actions/setup@979159a55bcf1f9edb9eb8f26ea10aca421412e2
        with:
          project: waozixyz/shovey
          path: ziranlang/ziran
          fetch: true
          packages: >-
            build-essential cmake pkg-config python3-pil python3-numpy libsdl2-dev libcairo2-dev
            libfreetype-dev libfontconfig-dev libpango1.0-dev libgtk-3-dev libcurl4-openssl-dev
            libx11-dev xvfb xauth xdotool imagemagick
      # The UI tests drive the player through Inner Breeze's test driver client.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: waozixyz/breeze
          ref: fa9c8acab237278d81c9929fa97b3f2545842310
          path: waozixyz/breeze
          sparse-checkout: tests/ui_driver.py
          sparse-checkout-cone-mode: false
      - name: Build and pack the Linux download
        run: make player-linux
      - name: Play the unpacked download on a private display
        run: |
          rm -rf build/linux-check
          mkdir -p build/linux-check
          tar -xzf build/downloads/shovey-v*-linux-x86_64.tar.gz -C build/linux-check
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            YUE_DESKTOP_RECOVERY=0 SDL_AUDIODRIVER=dummy timeout 300s xvfb-run -a -n 400 -s '-screen 0 1280x1000x24' \
            python3 tests/shovey_standalone_ui_test.py --binary "$PWD/build/linux-check/shovey/shovey" \
            --inbe-source "$GITHUB_WORKSPACE/waozixyz/breeze"
      - name: Reopen unclaimed and empty chests in the packaged game
        run: |
          make chest-fixture
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            YUE_DESKTOP_RECOVERY=0 SDL_AUDIODRIVER=dummy timeout 180s xvfb-run -a -n 400 -s '-screen 0 1280x1000x24' \
            python3 tests/chest_ui_test.py --binary "$PWD/build/linux-check/shovey/shovey" \
            --fixture build/chest-test/fixture.txt --driver-source "$GITHUB_WORKSPACE/waozixyz/breeze" \
            --output build/chest-ui-test
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-linux
          path: waozixyz/shovey/build/downloads/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: due
    if: needs.due.outputs.release_due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: waozixyz/shovey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.due.outputs.revision }}
          path: waozixyz/shovey
      - name: Set up the locked Ziran, its packages and the build tools
        uses: ziranlang/ziran/.github/actions/setup@979159a55bcf1f9edb9eb8f26ea10aca421412e2
        with:
          project: waozixyz/shovey
          path: ziranlang/ziran
          fetch: true
          packages: >-
            build-essential cmake pkg-config python3-pil python3-numpy gcc-mingw-w64-x86-64-win32
            binutils-mingw-w64-x86-64 libz-mingw-w64-dev wine wine64 xvfb xauth unzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: waozixyz/breeze
          ref: fa9c8acab237278d81c9929fa97b3f2545842310
          path: waozixyz/breeze
          sparse-checkout: tests/ui_driver.py
          sparse-checkout-cone-mode: false
      - name: Cross-build and pack the Windows download
        run: make player-windows
      - name: Play the unpacked download under Wine on a private display
        run: |
          rm -rf build/windows-check
          mkdir -p build/windows-check
          unzip -q build/downloads/shovey-v*-windows-x86_64.zip -d build/windows-check
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER -u GDK_DISPLAY \
            WINEPREFIX="$RUNNER_TEMP/wine" timeout 900s xvfb-run -a -n 400 -s '-screen 0 1280x1000x24' \
            python3 tests/shovey_windows_ui_test.py --program "$PWD/build/windows-check/Shovey/shovey.exe" \
            --inbe-source "$GITHUB_WORKSPACE/waozixyz/breeze"
      - uses: actions/upload-artifact@v4
        with:
          name: shovey-windows
          path: waozixyz/shovey/build/downloads/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [due, android, android-gplay, fdroid, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: waozixyz/shovey
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANGELOG_VERSION: ${{ needs.due.outputs.version }}
      RELEASE_REVISION: ${{ needs.due.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.due.outputs.revision }}
          path: waozixyz/shovey
      - uses: actions/download-artifact@v4
        with:
          pattern: shovey-*
          path: waozixyz/shovey/build/downloads
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: fdroid-unsigned
          path: waozixyz/shovey/build/fdroid-rebuild
      - name: Check every download is this version
        id: version
        run: |
          apk=$(ls build/downloads/shovey-v*.apk)
          version=${apk##*/shovey-v}
          version=${version%.apk}
          for file in "shovey-v$version.apk" "shovey-$version-fdroid.apk" "shovey-v$version-gplay.apk" "shovey-v$version-linux-x86_64.tar.gz" "shovey-v$version-windows-x86_64.zip"; do
            test -f "build/downloads/$file" || { echo "Missing $file" >&2; exit 1; }
          done
          test "$(ls build/downloads | wc -l)" = 5 || { ls build/downloads >&2; echo 'Downloads differ in version' >&2; exit 1; }
          test "$version" = "$CHANGELOG_VERSION" || { echo "The downloads are $version but the changelog names $CHANGELOG_VERSION" >&2; exit 1; }
          python3 scripts/android-release.py verify "build/downloads/shovey-v$version.apk" --version "$version"
          python3 scripts/android-release.py verify "build/downloads/shovey-$version-fdroid.apk" --version "$version"
          python3 scripts/android-release.py verify "build/downloads/shovey-v$version-gplay.apk" --edition gplay --version "$version"
          # F-Droid copies this signature onto its own build of the recipe, so
          # that rebuild must match the signed APK byte for byte.
          sudo apt-get update
          sudo apt-get install -y apksigcopier
          rebuilt=$(find build/fdroid-rebuild/tmp -name '*.apk')
          test "$(printf '%s\n' "$rebuilt" | wc -l)" = 1
          # apksigcopier runs apksigner, which the runner keeps in the
          # Android SDK's build-tools rather than on PATH.
          tools=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          PATH="$tools:$PATH" apksigcopier compare --unsigned "build/downloads/shovey-$version-fdroid.apk" "$rebuilt"
          python3 - "$version" > build/release-notes.md <<'PY'
          import re, sys
          text = open('src/CHANGELOG.md').read()
          section = re.search(r'^## \[' + re.escape(sys.argv[1]) + r'\] - .*?\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          print(section[1].strip())
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo "Shovey $VERSION is already published; its downloads stay as they are."
            exit 0
          fi
          # The downloads go up on a draft first, so the release appears
          # only once all of them are there.
          if [ "$state" = missing ]; then
            gh release create "$tag" --draft --target "$RELEASE_REVISION" --title "Shovey $VERSION" --notes-file build/release-notes.md
          else
            gh release edit "$tag" --target "$RELEASE_REVISION" --notes-file build/release-notes.md
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$tag" "$asset" --yes
            done
          fi
          gh release upload "$tag" build/downloads/*
          gh release edit "$tag" --draft=false --latest
          echo "Published Shovey $VERSION."
      # Arcade follows this release now, not at its next timer, and Breeze
      # then publishes it to the node. RELEASE_FOLLOW_TOKEN may only start
      # workflows in Arcade and Breeze; Game updates takes no input and finds
      # the newest game releases itself. Without it Arcade's timer follows.
      - name: Start Arcade's game update
        env:
          GH_TOKEN: ${{ secrets.RELEASE_FOLLOW_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASE_FOLLOW_TOKEN: Arcade's Game updates picks this release up on its timer."
            exit 0
          fi
          gh workflow run game-updates.yml -R waozixyz/arcade --ref master

  # The same release goes to Google Play's internal testing track as the
  # Google Play edition, with its Dew packs.
  google-play:
    needs: [due, release]
    if: needs.due.outputs.release_due == 'true'
    uses: ./.github/workflows/play-bundle.yml
    with:
      revision: ${{ needs.due.outputs.revision }}
    secrets: inherit
