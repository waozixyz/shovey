name: Editor desktop release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked desktop editor download
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: editor-desktop-release
  cancel-in-progress: false

jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: waozixyz/shovey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: waozixyz/shovey
      # The locked compiler comes prebuilt, the package checkouts cached, and
      # Ubuntu packages from the canonical archive.
      - name: Set up the locked Ziran, its packages and the test tools
        uses: ziranlang/ziran/.github/actions/setup@5d3e5ca4cae76398dd2545a0e33d2b741fe5d321
        with:
          project: waozixyz/shovey
          path: ziranlang/ziran
          fetch: true
          packages: >-
            build-essential pkg-config libsdl2-dev libcairo2-dev libfreetype6-dev libfontconfig-dev
            libpango1.0-dev python3-pil python3-numpy xvfb xauth xdotool imagemagick
      - name: Build the editor without campaign or reference data
        run: make admin-editor ZIRAN="$GITHUB_WORKSPACE/ziranlang/ziran/build/bin/ziran"
      - name: Check the extracted download on a private display
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS -u SESSION_MANAGER YUE_DESKTOP_RECOVERY=0 xvfb-run -a -n 400 -s '-screen 0 1600x1100x24' python3 tests/admin_editor_package_test.py
      - name: Publish the checked editor
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("build/admin-editor/package/shovey-level-editor/manifest.json"))["version"])')
          tag="editor-v$version"
          archive=build/admin-editor/shovey-level-editor-linux-x86_64.tar.gz
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace its checked download." >&2
            exit 1
          fi
          gh release create "$tag" "$archive" --target "$GITHUB_SHA" --title "Shovey Level Editor $version" --notes 'Create and play your own garden puzzles with Shovey artwork.'
