name: Google Play closed testing

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact published version completed on internal testing
        type: string
      version_code:
        description: Exact internal version code
        type: string
      inspect_only:
        description: Read all Play tracks and tester configuration without publishing
        type: boolean
        default: false

      wurm_secret_public_key:
        description: Optional Wurm repository public key for encrypted credential setup
        type: string

permissions:
  contents: read

concurrency:
  group: shovey-google-play
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate the published release
        if: ${{ !inputs.inspect_only }}
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          version = os.environ['VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Use a numeric release version'
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['VERSION_CODE']), 'Use a positive version code'
          url = f'https://git.waozi.xyz/api/v1/repos/waozi/shovey/releases/tags/v{version}'
          req = urllib.request.Request(url, headers={'User-Agent': 'Shovey-Play-Promote/1.0'})
          with urllib.request.urlopen(req, timeout=30) as resp:
              release = json.loads(resp.read())
          assert not release.get('draft') and release.get('published_at'), 'The version must already be published on Gitea'
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: waozixyz/entity
          ref: 2062597cecba5ce1bf54a20e6d5a2bdda148a06b
          path: play-entity
          persist-credentials: false
      - name: Test promotion boundaries
        run: python3 tests/play_promotion_test.py
      - name: Read tracks and complete closed testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE: xyz.waozi.shovey
          WURM_SECRET_PUBLIC_KEY: ${{ inputs.wurm_secret_public_key }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          INSPECT_ONLY: ${{ inputs.inspect_only }}
          CLOSED_TRACK: ${{ vars.GOOGLE_PLAY_CLOSED_TRACK || 'alpha' }}
        run: |
          python3 scripts/play-promote.py
      - name: Save the credential sealed to Wurm's repository key
        if: ${{ inputs.inspect_only && inputs.wurm_secret_public_key != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wurm-play-secret-encrypted
          path: wurm-play-secret.encrypted
          retention-days: 1
          if-no-files-found: error
